<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>BridgeWork — Quick Cash Tasks Near You</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2d6a4f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BridgeWork" />
<meta name="description" content="Find and claim quick cash tasks posted by local businesses." />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3"
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body, #root { height: 100%; width: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f8f9fa; color: #1a1a2e; line-height: 1.5;
}

:root {
  --green: #2d6a4f;
  --green-light: #40916c;
  --green-dark: #1b4332;
  --blue: #3a86ff;
  --blue-dark: #2563eb;
  --yellow: #f0ad4e;
  --red: #ef4444;
  --bg: #f8f9fa;
  --bg-card: #ffffff;
  --border: #e5e7eb;
  --text: #1a1a2e;
  --text-muted: #6b7280;
  --text-dim: #9ca3af;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
}

/* ─── Top bar ─── */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.5rem 1rem; pointer-events: none;
}
.top-bar > * { pointer-events: auto; }
.top-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: var(--bg-card); box-shadow: var(--shadow);
  cursor: pointer; font-size: 1.1rem; display: flex;
  align-items: center; justify-content: center; color: var(--text);
  transition: all 0.2s;
}
.top-btn:hover { box-shadow: var(--shadow-lg); }
.top-banner {
  background: var(--bg-card); border-radius: 2rem;
  padding: 0.5rem 1.25rem; box-shadow: var(--shadow);
  font-size: 0.85rem; font-weight: 600; display: flex;
  align-items: center; gap: 0.5rem;
}
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot-green { background: #22c55e; }
.dot-yellow { background: var(--yellow); }
.dot-red { background: var(--red); }

/* ─── Map legend ─── */
.map-legend {
  position: fixed; bottom: 1rem; left: 1rem; z-index: 50;
  display: flex; gap: 1rem; background: var(--bg-card);
  padding: 0.4rem 1rem; border-radius: 2rem; box-shadow: var(--shadow);
  font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
}
.map-legend span { display: flex; align-items: center; gap: 4px; }

/* ─── GPS + Chat buttons ─── */
.map-actions {
  position: fixed; bottom: 1rem; right: 1rem; z-index: 50;
  display: flex; flex-direction: column; gap: 0.75rem;
}
.map-actions .top-btn { width: 48px; height: 48px; font-size: 1.3rem; }
.chat-btn {
  background: var(--blue) !important; color: #fff !important;
  box-shadow: 0 4px 12px rgba(58,134,255,0.3);
}

/* ─── Sidebar / Menu ─── */
.sidebar-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.sidebar-overlay.open { opacity: 1; pointer-events: auto; }
.sidebar {
  position: fixed; top: 0; left: -280px; bottom: 0; width: 280px;
  background: var(--bg-card); z-index: 210; transition: left 0.3s;
  box-shadow: var(--shadow-lg); overflow-y: auto;
}
.sidebar-overlay.open .sidebar { left: 0; }
.sidebar-header {
  padding: 1.5rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 0.75rem;
}
.sidebar-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--green); color: #fff; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
}
.sidebar-name { font-weight: 700; font-size: 0.95rem; }
.sidebar-role {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  padding: 2px 8px; border-radius: 1rem;
  background: rgba(45,106,79,0.1); color: var(--green);
  display: inline-block; margin-top: 2px;
}
.sidebar-links { padding: 0.75rem 0; }
.sidebar-link {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.85rem 1.5rem; font-size: 0.9rem; font-weight: 500;
  color: var(--text); cursor: pointer; transition: background 0.2s;
  border: none; background: none; width: 100%; text-align: left;
  font-family: inherit;
}
.sidebar-link:hover { background: #f3f4f6; }
.sidebar-divider { height: 1px; background: var(--border); margin: 0.5rem 1.5rem; }

/* ─── Buttons ─── */
.btn {
  padding: 0.7rem 1.5rem; border: none; border-radius: 0.75rem;
  font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
  font-family: inherit; display: inline-flex; align-items: center;
  justify-content: center; gap: 0.5rem;
}
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: var(--green-dark); }
.btn-blue { background: var(--blue); color: #fff; }
.btn-blue:hover { background: var(--blue-dark); }
.btn-outline {
  background: transparent; border: 1.5px solid var(--border);
  color: var(--text-muted);
}
.btn-outline:hover { border-color: var(--green); color: var(--green); }
.btn-danger { background: var(--red); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { padding: 0.5rem 1rem; font-size: 0.8rem; }

/* ─── Cards ─── */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 1rem; box-shadow: var(--shadow); overflow: hidden;
}

/* ─── Forms ─── */
input, textarea, select {
  background: var(--bg-card); border: 1.5px solid var(--border);
  color: var(--text); padding: 0.75rem 1rem; border-radius: 0.75rem;
  font-size: 16px; width: 100%; font-family: inherit; transition: border-color 0.2s;
}
input:focus, textarea:focus, select:focus {
  outline: none; border-color: var(--green);
}
label {
  font-size: 0.85rem; font-weight: 600; color: var(--text);
  margin-bottom: 0.35rem; display: block;
}
.form-group { margin-bottom: 1rem; }

/* ─── Auth page ─── */
.auth-page {
  min-height: 100vh; display: flex; align-items: center;
  justify-content: center; padding: 1.5rem; background: var(--bg);
}
.auth-box {
  width: 100%; max-width: 400px; background: var(--bg-card);
  border-radius: 1.5rem; padding: 2rem; box-shadow: var(--shadow-lg);
}
.auth-logo { text-align: center; margin-bottom: 1.5rem; }
.auth-logo h1 {
  font-size: 1.8rem; font-weight: 900; color: var(--green);
}
.auth-logo h1 span { color: var(--text); }
.auth-logo p { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }
.role-selector { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
.role-btn {
  flex: 1; padding: 0.75rem; border: 2px solid var(--border);
  border-radius: 0.75rem; background: none; cursor: pointer;
  font-weight: 700; font-size: 0.85rem; color: var(--text-muted);
  transition: all 0.2s; font-family: inherit; text-align: center;
}
.role-btn.active {
  border-color: var(--green); color: var(--green);
  background: rgba(45,106,79,0.05);
}
.auth-toggle {
  text-align: center; margin-top: 1.25rem; font-size: 0.85rem;
  color: var(--text-muted);
}
.auth-toggle a {
  color: var(--green); font-weight: 600; cursor: pointer;
  text-decoration: none;
}

/* ─── Page panels (profile, post job, etc.) ─── */
.page-panel {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg); overflow-y: auto;
}
.page-header {
  background: var(--green-dark); color: #fff; padding: 1rem 1.25rem;
  display: flex; align-items: center; gap: 0.75rem;
  position: sticky; top: 0; z-index: 10;
}
.page-header h2 { font-size: 1.1rem; font-weight: 700; }
.page-header p { font-size: 0.8rem; opacity: 0.75; }
.back-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.15); border: none; color: #fff;
  font-size: 1.1rem; cursor: pointer; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
}
.page-body { padding: 1.25rem; max-width: 600px; margin: 0 auto; }

/* ─── Profile ─── */
.profile-header {
  text-align: center; padding: 2rem 1.5rem;
  background: var(--green-dark); color: #fff;
}
.profile-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(255,255,255,0.15); color: #fff;
  font-size: 1.5rem; font-weight: 800; margin: 0 auto 0.75rem;
  display: flex; align-items: center; justify-content: center;
}
.profile-name { font-size: 1.2rem; font-weight: 700; }
.profile-badge {
  display: inline-block; padding: 3px 10px; border-radius: 1rem;
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  background: rgba(255,255,255,0.2); margin-top: 0.25rem;
}
.profile-email { font-size: 0.85rem; opacity: 0.75; margin-top: 0.25rem; }
.stats-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.stat-item {
  text-align: center; padding: 1rem;
  border-right: 1px solid var(--border);
}
.stat-item:last-child { border-right: none; }
.stat-num { font-size: 1.5rem; font-weight: 800; color: var(--green); }
.stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.15rem; }

/* ─── Job card (on map popup & lists) ─── */
.job-card { padding: 1.25rem; }
.job-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.25rem; }
.job-pay {
  font-size: 1.4rem; font-weight: 900; color: var(--green);
  margin-bottom: 0.5rem;
}
.job-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem; }
.job-meta {
  display: flex; gap: 0.75rem; font-size: 0.75rem; color: var(--text-dim);
  flex-wrap: wrap; margin-bottom: 0.75rem;
}
.job-status {
  display: inline-block; padding: 3px 10px; border-radius: 1rem;
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
}
.status-open { background: rgba(34,197,94,0.1); color: #16a34a; }
.status-claimed { background: rgba(240,173,78,0.1); color: #d97706; }
.status-done { background: rgba(45,106,79,0.1); color: var(--green); }
.status-reported { background: rgba(239,68,68,0.1); color: var(--red); }

/* ─── Admin ─── */
.admin-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  background: var(--green-dark); color: #fff;
}
.admin-stat { text-align: center; padding: 1rem; }
.admin-stat-num { font-size: 1.5rem; font-weight: 800; }
.admin-stat-label { font-size: 0.7rem; opacity: 0.75; text-transform: uppercase; }
.admin-tabs {
  display: flex; border-bottom: 1px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.admin-tab {
  padding: 0.75rem 1.25rem; font-size: 0.85rem; font-weight: 600;
  color: var(--text-muted); cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent; white-space: nowrap;
  font-family: inherit; transition: all 0.2s;
}
.admin-tab.active { color: var(--green); border-bottom-color: var(--green); }
.user-row {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.85rem 1.25rem; border-bottom: 1px solid var(--border);
}
.user-info { flex: 1; }
.user-name { font-weight: 600; font-size: 0.9rem; }
.user-email { font-size: 0.8rem; color: var(--text-muted); }

/* ─── Job detail bottom sheet ─── */
.bottom-sheet {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg-card); border-radius: 1.5rem 1.5rem 0 0;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
  max-height: 60vh; overflow-y: auto;
  transform: translateY(100%); transition: transform 0.3s ease;
}
.bottom-sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 40px; height: 4px; border-radius: 2px;
  background: var(--border); margin: 0.75rem auto;
}

/* ─── Notification bar ─── */
.notif-bar {
  display: flex; gap: 0.5rem; margin-bottom: 1rem;
}
.notif-bar .role-btn { flex: 1; padding: 0.6rem; font-size: 0.8rem; }

/* ─── Responsive ─── */
@media (hover: none) and (pointer: coarse) {
  .btn { min-height: 44px; }
  .btn-sm { min-height: 38px; }
  input, textarea, select { min-height: 44px; }
}
@media (max-width: 480px) {
  .top-banner { font-size: 0.75rem; padding: 0.4rem 1rem; }
  .admin-stats { grid-template-columns: 1fr 1fr 1fr; }
  .stats-row { grid-template-columns: 1fr 1fr 1fr; }
}
@supports (padding-top: env(safe-area-inset-top)) {
  .top-bar { padding-top: max(0.5rem, env(safe-area-inset-top)); }
  .map-legend { bottom: max(1rem, env(safe-area-inset-bottom)); }
  .map-actions { bottom: max(1rem, env(safe-area-inset-bottom)); }
}

/* ─── MapBox popup override ─── */
.mapboxgl-popup-content {
  padding: 0 !important; border-radius: 1rem !important;
  box-shadow: var(--shadow-lg) !important; min-width: 260px;
}
.mapboxgl-popup-close-button {
  font-size: 1.2rem; padding: 4px 8px; color: var(--text-muted);
}
</style>
</head>
<body>
<div id="root"></div>
<script>window.__MAPBOX_TOKEN = "MAPBOX_TOKEN_PLACEHOLDER";</script>
<script type="module" src="/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
